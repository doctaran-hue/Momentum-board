name: daily scan

"on":
  schedule:
    # 12:40 UTC = 18:10 IST, ~2h40m after NSE close, so the vendor has settled.
    - cron: "40 12 * * 1-5"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write           # required to commit the new data back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -q yfinance pandas numpy requests

      - name: Run scan
        run: python scan.py

      - name: Commit results
        run: |
          git config user.name  "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "scan $(date -u +%Y-%m-%d)"
            git push
          fi
